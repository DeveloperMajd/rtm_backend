# Internal-only vhost — never exposed to the host or the internet directly;
# only the shared Caddy container (on the `web` network) reverse-proxies to
# this. PHP-FPM runs in a *separate* container (`app`), reached over
# FastCGI, which doesn't share this container's filesystem — so unlike a
# typical single-host Laravel nginx config, this can't do a real `try_files`
# existence check against `public/`. That's fine here: RTM's backend is a
# pure JSON API (no static assets to serve directly — attachments/avatars
# already go through a signed-URL controller, not bare static files), so
# every request is simply handed to Laravel's single front controller,
# exactly like Laravel's own routing already assumes.
server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120;
    }
}
