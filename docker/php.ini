; Loaded after php.ini-production, which the Dockerfile makes the image's
; php.ini: errors are logged and never shown in a response. Without any
; php.ini, PHP ran on its built-in defaults, which show them.

; An attachment can be up to 15 MB and an avatar 5 MB, one file per request
; (StoreAttachmentRequest, StoreAvatarRequest). PHP's default refused
; anything over 2 MB. nginx takes a request body up to 20 MB
; (client_max_body_size), so PHP takes the same.
upload_max_filesize = 16M
post_max_size = 20M

; No "X-Powered-By: PHP/8.5.x" header on every response.
expose_php = Off
