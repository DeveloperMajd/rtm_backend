; The pool PHP-FPM serves the API with, loaded after the image's own pool
; files so these settings win. The stock pool ran at most 5 requests at a
; time.
;
; Sized for the VM: 2 CPUs and 12 GB of RAM, shared with other apps. A
; worker's RSS is 60-70 MB, most of it shared (opcache, libraries), and
; memory_limit caps a request at 128 MB, so 20 workers stay near 1.3 GB and
; under 3 GB at the very worst. More wouldn't help on 2 CPUs: requests
; spend most of their time waiting on Postgres (Neon), Redis and R2, and
; past about 20 they'd queue for the CPU instead. Each busy worker holds
; one Postgres connection, far below what Neon allows.
;
; All 20 start with the container and stay: there's memory to spare, and a
; burst (every client reconnecting after a deploy) doesn't wait for workers
; to be started. The dynamic mode adds them gradually, a few each second,
; and took 3-4 s to answer 20 one-second requests arriving together.
[www]
pm = static
pm.max_children = 20

; A worker is replaced after 500 requests, so a slow leak can't grow forever.
pm.max_requests = 500
