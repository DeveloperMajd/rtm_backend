# Production stack for RTM's backend. Deployed on the shared Oracle VM,
# alongside other unrelated projects — `web` is an external network shared
# with the one Caddy instance that reverse-proxies every project on the box
# by subdomain (see the separate proxy stack, not part of this repo).
#
# Deploy flow (run on the server, from this file's directory):
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm -T app php artisan migrate --force < /dev/null
#   docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps app queue reverb
#   docker compose -f docker-compose.prod.yml restart nginx
#
# None of the flags above are decorative — the first two automated deploys
# both "succeeded" while silently leaving the old code running, and every
# one of these was found chasing that down:
#
# `-T ... < /dev/null` on `run`: by far the real bug. `docker compose run`
# attaches to stdin by default; when this whole deploy runs as a script fed
# to `ssh host 'bash -s' <<HEREDOC`, that script's own stdin *is* the
# heredoc stream. Without redirecting `run`'s stdin away from it, `run`
# consumes the rest of that stream itself — silently truncating the script
# right after the migrate command, before `up -d` or `restart nginx` ever
# execute. Bash then just hits EOF, which isn't an error, so the step still
# reports success. `-T` (no pseudo-TTY) plus `< /dev/null` (its own,
# already-closed stdin) stops it from ever touching the outer script's
# stream. This alone was confirmed to fully explain both prior failures —
# the `--force-recreate` below was a plausible-looking fix for what turned
# out to be a red herring (an interactive-only test that didn't include the
# migrate step, so it didn't reproduce the real bug). It's kept anyway as a
# harmless, genuinely-belt-and-suspenders guarantee that app/queue/reverb
# always end up on the image that was just built, rather than depending on
# `up -d`'s own change-detection being right every time.
# `--no-deps` keeps that recreate scoped to just those three (nginx is
# handled next, deliberately not via the same recreate).
#
# `restart nginx`: nginx's own image never changes, so it's correctly left
# out of the recreate above — but it resolves the `app` hostname once, at
# its own startup, not per-request. Once `app` gets a new container (and
# therefore a new internal IP), nginx keeps talking to the old, now-dead
# IP until it's restarted too, and every request 502s with "Connection
# refused" until that happens.
name: rtm

services:
  # app/queue/reverb all build from the same Dockerfile with no per-service
  # build args — giving them the same `image:` tag means `docker compose
  # build` builds it once and the other two just reuse that image, instead
  # of rebuilding the identical Dockerfile three times on every deploy.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtm-app:latest
    container_name: rtm-app
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - storage-app:/var/www/html/storage/app
    networks:
      - rtm-internal

  nginx:
    image: nginx:alpine
    container_name: rtm-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rtm-internal
      - web

  queue:
    image: rtm-app:latest
    container_name: rtm-queue
    restart: unless-stopped
    env_file: ./.env
    # "database", not "redis": see .env.production.example's note on
    # SESSION_DRIVER/CACHE_STORE/QUEUE_CONNECTION for why.
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - storage-app:/var/www/html/storage/app
    networks:
      - rtm-internal
    depends_on:
      - app

  reverb:
    image: rtm-app:latest
    container_name: rtm-reverb
    restart: unless-stopped
    env_file: ./.env
    # No --host/--port flags: falls back to REVERB_SERVER_HOST/PORT in .env,
    # keeping one source of truth instead of two places to update.
    command: ["php", "artisan", "reverb:start"]
    networks:
      - rtm-internal
      - web
    depends_on:
      - app

networks:
  rtm-internal:
    driver: bridge
  web:
    external: true

volumes:
  storage-app:
