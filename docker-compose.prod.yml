# Production stack for RTM's backend. Deployed on the shared Oracle VM,
# alongside other unrelated projects — `web` is an external network shared
# with the one Caddy instance that reverse-proxies every project on the box
# by subdomain (see the separate proxy stack, not part of this repo).
#
# Deploy flow (run on the server, from this file's directory):
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force
#   docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps app queue reverb
#   docker compose -f docker-compose.prod.yml restart nginx
#
# Neither of the last two lines is optional, and both were found the hard
# way (the first automated deploy "succeeded" while silently leaving the
# old code running):
#
# `--force-recreate` on app/queue/reverb: plain `up -d` decides whether to
# recreate a container by comparing a config hash, and for a service that's
# only ever referenced by a stable `image:` tag (queue/reverb) rather than
# its own `build:`, that comparison can consider the tag string unchanged
# and skip recreating it — even though `build` just pointed the tag at a
# brand new image. This was confirmed to work fine when run interactively
# but NOT when driven by a non-interactive SSH script (the exact way the
# GitHub Actions workflow runs it), so don't trust interactive testing
# alone here — force it explicitly instead of relying on that detection.
# `--no-deps` keeps this scoped to just those three (nginx is handled next).
#
# `restart nginx`: nginx's own image never changes, so it's correctly left
# out of the recreate above — but it resolves the `app` hostname once, at
# its own startup, not per-request. Once `app` gets a new container (and
# therefore a new internal IP), nginx keeps talking to the old, now-dead
# IP until it's restarted too, and every request 502s with "Connection
# refused" until that happens.
name: rtm

services:
  # app/queue/reverb all build from the same Dockerfile with no per-service
  # build args — giving them the same `image:` tag means `docker compose
  # build` builds it once and the other two just reuse that image, instead
  # of rebuilding the identical Dockerfile three times on every deploy.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtm-app:latest
    container_name: rtm-app
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - storage-app:/var/www/html/storage/app
    networks:
      - rtm-internal

  nginx:
    image: nginx:alpine
    container_name: rtm-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rtm-internal
      - web

  queue:
    image: rtm-app:latest
    container_name: rtm-queue
    restart: unless-stopped
    env_file: ./.env
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - storage-app:/var/www/html/storage/app
    networks:
      - rtm-internal
    depends_on:
      - app

  reverb:
    image: rtm-app:latest
    container_name: rtm-reverb
    restart: unless-stopped
    env_file: ./.env
    # No --host/--port flags: falls back to REVERB_SERVER_HOST/PORT in .env,
    # keeping one source of truth instead of two places to update.
    command: ["php", "artisan", "reverb:start"]
    networks:
      - rtm-internal
      - web
    depends_on:
      - app

networks:
  rtm-internal:
    driver: bridge
  web:
    external: true

volumes:
  storage-app:
